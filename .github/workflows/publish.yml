name: Publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ghcr.io/mhsanaei/3x-ui:latest
          docker tag ghcr.io/mhsanaei/3x-ui:latest ghcr.io/${{ github.repository_owner }}/xui:latest
          docker push ghcr.io/${{ github.repository_owner }}/xui:latest
